name: Build & publish HA add-on

on:
  push:
    tags:
      - "v*"          # trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # allow manual runs from the GitHub Actions UI

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/mediastat-addon

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python3 -m pytest tests/ -v

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Sync app sources into ha-addon/
        run: |
          cp src/main.py requirements.txt ha-addon/
          cp -r src/templates ha-addon/
          cp -r src/static ha-addon/

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' from tag (v1.0.0 → 1.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          # Fall back to 'dev' for manual/branch runs
          VERSION="${VERSION:-dev}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Record build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Update the version field in ha-addon/config.yaml to match the tag,
  # then commit it back so HA shows the correct version in the UI.
  update-version:
    name: Bump version in config.yaml
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Bump version and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version: .*/version: \"${VERSION}\"/" ha-addon/config.yaml
          git add ha-addon/config.yaml
          if git diff --cached --quiet; then
            echo "Version already set to ${VERSION} — nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump add-on version to ${VERSION}"
          git push origin main
